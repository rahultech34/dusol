name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting deployment on server..."
            
            # Load environment paths (Node, npm, nvm, pm2)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            
            echo "Using Node: $(node -v 2>/dev/null || echo 'not found')"
            echo "Using NPM: $(npm -v 2>/dev/null || echo 'not found')"
            
            # Go to project directory
            cd ${{ secrets.PROJECT_PATH }}
            
            # Fetch and pull latest main branch
            git fetch origin main
            git reset --hard origin/main
            
            # Install dependencies and build
            npm install
            npm run build
            
            # Find the exact PM2 process running from this directory
            TARGET_DIR="${{ secrets.PROJECT_PATH }}"
            APP_NAME=$(pm2 jlist 2>/dev/null | node -e '
              try {
                const list = JSON.parse(require("fs").readFileSync(0, "utf-8"));
                const target = process.argv[1];
                const app = list.find(p => p.pm2_env && (p.pm2_env.pm_cwd === target || p.pm2_env.pm_cwd === target + "/"));
                if (app) console.log(app.name);
              } catch (e) {}
            ' "$TARGET_DIR")
            
            if [ -n "$APP_NAME" ]; then
              echo "🔄 Found PM2 app: '$APP_NAME'. Restarting..."
              pm2 restart "$APP_NAME" --update-env
            else
              echo "⚠️ No existing PM2 process found for $TARGET_DIR. Starting as 'dusol'..."
              pm2 start npm --name "dusol" -- start
            fi
            
            pm2 save
            echo "✅ Deployment completed successfully!"
