name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: 22
          script: |
            set -e
            echo "🚀 Starting deployment on server..."
            
            # Load environment paths (Node, npm, nvm, pm2)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            
            echo "Using Node: $(node -v 2>/dev/null || echo 'not found')"
            echo "Using NPM: $(npm -v 2>/dev/null || echo 'not found')"
            
            # Go to project directory
            cd ${{ secrets.PROJECT_PATH }}
            
            # Fetch and pull latest main branch
            git fetch origin main
            git reset --hard origin/main
            
            # Install dependencies and build
            npm install
            npm run build
            
            # Restart or reload PM2 process
            if pm2 list | grep -q "dusol"; then
              pm2 reload dusol --update-env || pm2 restart dusol --update-env
            else
              pm2 restart all || pm2 start npm --name "dusol" -- start
            fi
            
            pm2 save
            echo "✅ Deployment completed successfully!"
