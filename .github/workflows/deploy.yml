name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Prepare firebase-key.json
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_KEY_JSON }}
        run: |
          if [ -n "$FIREBASE_KEY" ]; then
            B64=$(printf '%s' "$FIREBASE_KEY" | base64 -w 0)
            echo "FIREBASE_KEY_B64=$B64" >> $GITHUB_ENV
          else
            echo "FIREBASE_KEY_B64=" >> $GITHUB_ENV
          fi

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          key: ${{ secrets.SERVER_SSH_KEY || secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            echo "🚀 Starting deployment for dusol-app..."
            
            # Load environment paths (Node, npm, nvm, pm2)
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin:/usr/bin:/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin
            
            # 1. Verify target directory
            cd ${{ secrets.PROJECT_PATH }}
            
            # 2. Pull latest code cleanly
            git fetch origin main
            git reset --hard origin/main
            
            # 3. Sync firebase-key.json from GitHub Secrets if provided
            if [ -n '${{ env.FIREBASE_KEY_B64 }}' ]; then
              echo '${{ env.FIREBASE_KEY_B64 }}' | base64 -d > firebase-key.json
              echo "🔑 firebase-key.json synced from GitHub Secrets."
            fi
            
            # 4. Install dependencies and build
            npm install
            npm run build
            
            # 5. Strictly reload/restart ONLY the existing 'dusol-app' process
            # (No new process creation to prevent port conflicts)
            if pm2 describe dusol-app > /dev/null 2>&1; then
              echo "🔄 Restarting existing 'dusol-app' PM2 process..."
              pm2 reload dusol-app --update-env || pm2 restart dusol-app --update-env
            else
              echo "❌ ERROR: 'dusol-app' process not found in PM2. Aborting to prevent port conflicts."
              exit 1
            fi
            
            # 6. Verify process status
            pm2 status dusol-app
            pm2 save
            
            echo "✅ Deployment completed successfully with zero conflicts!"
